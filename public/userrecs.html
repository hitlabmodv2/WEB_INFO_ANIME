<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Recommendations Terbaik | MyAnimeList</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
            pointer-events: none;
        }

        .userrecs-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .userrecs-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .userrecs-header h1 {
            margin: 0 0 10px 0;
            color: #2E51A2;
            font-size: 32px;
        }

        .userrecs-header p {
            margin: 0;
            color: #666;
            font-size: 16px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2E51A2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #1e3a7a;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .user-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .username {
            font-size: 18px;
            font-weight: 700;
            color: #2E51A2;
            margin: 0;
        }

        .rec-count {
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }

        .rec-count-number {
            font-size: 24px;
            color: #2E51A2;
            font-weight: 700;
            display: block;
        }

        .section-title {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .section-title h2 {
            margin: 0;
            color: #2E51A2;
            font-size: 20px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
        }

        .pagination-btn {
            padding: 12px 24px;
            background: white;
            color: #2E51A2;
            border: 2px solid #2E51A2;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #2E51A2;
            color: white;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .users-grid {
                grid-template-columns: 1fr;
            }

            .userrecs-header h1 {
                font-size: 24px;
            }
        }

        .userrecs-stats {
            margin-bottom: 25px;
        }

        .userrecs-stats-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease;
        }

        .userrecs-stats-icon {
            font-size: 3em;
        }

        .userrecs-stats-content {
            flex: 1;
        }

        .userrecs-stats-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .userrecs-stats-count {
            font-size: 2.5em;
            font-weight: 700;
            color: #2E51A2;
            margin-bottom: 5px;
        }

        .userrecs-stats-subtitle {
            font-size: 0.75em;
            color: #888;
        }

        @media (max-width: 768px) {
            .userrecs-stats-card {
                padding: 15px;
            }
            
            .userrecs-stats-icon {
                font-size: 2.5em;
            }
            
            .userrecs-stats-count {
                font-size: 2em;
            }
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body.dark-mode::before {
            background: rgba(0, 0, 0, 0.5);
        }

        body.dark-mode .userrecs-header,
        body.dark-mode .user-card,
        body.dark-mode .section-title,
        body.dark-mode .userrecs-stats-card {
            background: #2d2d44;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .userrecs-header h1,
        body.dark-mode .section-title h2,
        body.dark-mode .username,
        body.dark-mode .rec-count-number,
        body.dark-mode .userrecs-stats-count {
            color: #a5b4fc;
        }

        body.dark-mode .userrecs-header p,
        body.dark-mode .rec-count,
        body.dark-mode .userrecs-stats-label,
        body.dark-mode .userrecs-stats-subtitle {
            color: #9ca3af;
        }

        body.dark-mode .back-btn {
            background: #667eea;
            color: white;
        }

        body.dark-mode .back-btn:hover {
            background: #764ba2;
        }

        body.dark-mode .pagination-btn {
            background: #2d2d44;
            border-color: #667eea;
            color: #a5b4fc;
        }

        body.dark-mode .pagination-btn:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        body.dark-mode .page-info {
            color: #a5b4fc;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .theme-toggle .sun-icon,
        .theme-toggle .moon-icon {
            position: absolute;
            transition: all 0.3s ease;
        }

        .theme-toggle .sun-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .theme-toggle .moon-icon {
            opacity: 0;
            transform: rotate(180deg) scale(0);
        }

        body.dark-mode .theme-toggle .sun-icon {
            opacity: 0;
            transform: rotate(-180deg) scale(0);
        }

        body.dark-mode .theme-toggle .moon-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
    </style>
</head>
<body>
    <div class="userrecs-container">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <div class="userrecs-header">
            <h1>🌟 User Recommendations Terbaik</h1>
            <p>Rekomendasi anime terbaik dari komunitas MyAnimeList</p>
            <a href="/" class="back-btn">← Kembali ke Beranda</a>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Memuat rekomendasi...</p>
        </div>

        <div id="content"></div>
    </div>

    <div id="pageTransition">
        <div class="transition-spinner"></div>
        <p class="transition-text">Memuat halaman...</p>
    </div>

    <button id="scrollToTop" class="scroll-to-top" onclick="scrollToTop()">
        ↑
    </button>

    <script src="background-manager.js"></script>
    <script src="userrecs.js"></script>
</body>
</html>
