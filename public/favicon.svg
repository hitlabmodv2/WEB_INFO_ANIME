<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e8e8ff;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="100" height="100" rx="20" fill="url(#bg)"/>
    
    <!-- Face circle -->
    <circle cx="50" cy="50" r="32" fill="url(#face)" filter="url(#shadow)"/>
    
    <!-- Left ear -->
    <ellipse cx="25" cy="42" rx="6" ry="9" fill="url(#bg)" opacity="0.9"/>
    <ellipse cx="25" cy="42" rx="4" ry="6" fill="#fff" opacity="0.5"/>
    
    <!-- Right ear -->
    <ellipse cx="75" cy="42" rx="6" ry="9" fill="url(#bg)" opacity="0.9"/>
    <ellipse cx="75" cy="42" rx="4" ry="6" fill="#fff" opacity="0.5"/>
    
    <!-- Left eye -->
    <ellipse cx="40" cy="45" rx="7" ry="10" fill="#667eea"/>
    <ellipse cx="40" cy="45" rx="5.5" ry="8.5" fill="#2d2d44"/>
    <circle cx="40" cy="43" r="4.5" fill="#667eea"/>
    <circle cx="41.5" cy="41.5" r="3" fill="#a5b4fc"/>
    <circle cx="42.5" cy="40.5" r="2" fill="#fff"/>
    
    <!-- Right eye -->
    <ellipse cx="60" cy="45" rx="7" ry="10" fill="#667eea"/>
    <ellipse cx="60" cy="45" rx="5.5" ry="8.5" fill="#2d2d44"/>
    <circle cx="60" cy="43" r="4.5" fill="#667eea"/>
    <circle cx="61.5" cy="41.5" r="3" fill="#a5b4fc"/>
    <circle cx="62.5" cy="40.5" r="2" fill="#fff"/>
    
    <!-- Blush -->
    <ellipse cx="30" cy="52" rx="4" ry="3" fill="#f093fb" opacity="0.4"/>
    <ellipse cx="70" cy="52" rx="4" ry="3" fill="#f093fb" opacity="0.4"/>
    
    <!-- Smile -->
    <path d="M 42 60 Q 50 65 58 60" stroke="#764ba2" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Antenna left -->
    <path d="M 45 25 Q 43 18 42 14" stroke="url(#bg)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="14" r="2.5" fill="#f093fb"/>
    
    <!-- Antenna right -->
    <path d="M 55 25 Q 57 18 58 14" stroke="url(#bg)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="58" cy="14" r="2.5" fill="#667eea"/>
    
    <!-- Sparkle -->
    <path d="M 80 20 L 81 23 L 80 26 L 79 23 Z" fill="#fff" opacity="0.9"/>
    <circle cx="80" cy="23" r="1.5" fill="#fff" opacity="0.8"/>
</svg>
