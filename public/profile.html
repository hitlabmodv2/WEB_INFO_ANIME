<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | MyAnimeList</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
            pointer-events: none;
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .profile-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .profile-header {
            position: relative;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2E51A2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #1e3a7a;
        }

        .profile-main {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .profile-header {
                padding: 20px;
            }
            
            .back-btn {
                padding: 8px 16px;
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            .profile-header {
                padding: 15px;
            }
            
            .back-btn {
                padding: 6px 14px;
                font-size: 0.85em;
                margin-bottom: 15px;
            }
            
            .profile-username {
                font-size: 24px !important;
            }
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
            min-width: 300px;
        }

        .profile-username {
            font-size: 32px;
            font-weight: 700;
            color: #2E51A2;
            margin: 0 0 10px 0;
        }

        .profile-detail {
            margin: 8px 0;
            color: #666;
            font-size: 14px;
        }

        .profile-detail strong {
            color: #333;
            margin-right: 8px;
        }

        .profile-stats {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .profile-stats h2 {
            color: #2E51A2;
            margin: 0 0 20px 0;
            font-size: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #2E51A2;
        }

        .profile-favorites {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .profile-favorites h2 {
            color: #2E51A2;
            margin: 0 0 20px 0;
            font-size: 24px;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .favorite-item {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .favorite-item:hover {
            transform: scale(1.05);
        }

        .favorite-image {
            width: 100px;
            height: 140px;
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto 8px auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .favorite-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .favorite-name {
            font-size: 12px;
            color: #333;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #e74c3c;
            font-size: 18px;
        }

        .profile-recommendations {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .profile-recommendations h2 {
            color: #2E51A2;
            margin: 0 0 20px 0;
            font-size: 24px;
        }

        .recommendations-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .recommendation-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .recommendation-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .recommendation-images {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .rec-image-wrapper {
            text-align: center;
            flex: 0 0 auto;
        }

        .rec-image-wrapper img {
            width: 120px;
            height: 170px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .rec-title {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .rec-arrow {
            font-size: 24px;
            color: #2E51A2;
            font-weight: bold;
            flex: 0 0 auto;
        }

        .recommendation-description {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2E51A2;
        }

        .recommendation-description p {
            margin: 0 0 8px 0;
            color: #333;
            line-height: 1.6;
            font-size: 14px;
        }

        .recommendation-date {
            font-size: 12px;
            color: #999;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .profile-main {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .favorites-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .profile-recommendations {
                padding: 20px;
            }

            .recommendation-item {
                padding: 15px;
            }

            .rec-image-wrapper img {
                width: 100px;
                height: 140px;
            }

            .rec-title {
                max-width: 100px;
                font-size: 12px;
            }

            .rec-arrow {
                font-size: 20px;
            }

            .recommendation-description {
                padding: 12px;
            }

            .recommendation-description p {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .recommendation-images {
                gap: 10px;
            }

            .rec-image-wrapper img {
                width: 80px;
                height: 115px;
            }

            .rec-title {
                max-width: 80px;
                font-size: 11px;
            }

            .rec-arrow {
                font-size: 18px;
            }

            .recommendation-description p {
                font-size: 12px;
            }
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body.dark-mode::before {
            background: rgba(0, 0, 0, 0.5);
        }

        body.dark-mode .profile-header,
        body.dark-mode .profile-stats,
        body.dark-mode .profile-favorites,
        body.dark-mode .profile-recommendations {
            background: #2d2d44;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .profile-username,
        body.dark-mode .profile-stats h2,
        body.dark-mode .profile-favorites h2,
        body.dark-mode .profile-recommendations h2 {
            color: #a5b4fc;
        }

        body.dark-mode .profile-detail {
            color: #9ca3af;
        }

        body.dark-mode .profile-detail strong {
            color: #e0e0e0;
        }

        body.dark-mode .stat-item {
            background: #1f1f2e;
        }

        body.dark-mode .stat-label {
            color: #9ca3af;
        }

        body.dark-mode .stat-value {
            color: #a5b4fc;
        }

        body.dark-mode .favorite-name {
            color: #e0e0e0;
        }

        body.dark-mode .back-btn {
            background: #667eea;
            color: white;
        }

        body.dark-mode .back-btn:hover {
            background: #764ba2;
        }

        body.dark-mode .recommendation-item {
            background: #1f1f2e;
        }

        body.dark-mode .rec-title {
            color: #e0e0e0;
        }

        body.dark-mode .rec-arrow {
            color: #a5b4fc;
        }

        body.dark-mode .recommendation-description {
            background: #2d2d44;
            border-left-color: #667eea;
        }

        body.dark-mode .recommendation-description p {
            color: #e0e0e0;
        }

        body.dark-mode .recommendation-date {
            color: #9ca3af;
        }

        body.dark-mode .error-message {
            background: #2d2d44;
            color: #f87171;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .theme-toggle .sun-icon,
        .theme-toggle .moon-icon {
            position: absolute;
            transition: all 0.3s ease;
        }

        .theme-toggle .sun-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        .theme-toggle .moon-icon {
            opacity: 0;
            transform: rotate(180deg) scale(0);
        }

        body.dark-mode .theme-toggle .sun-icon {
            opacity: 0;
            transform: rotate(-180deg) scale(0);
        }

        body.dark-mode .theme-toggle .moon-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Memuat profil user...</p>
        </div>

        <div id="content" style="display: none;"></div>
    </div>

    <div id="pageTransition">
        <div class="transition-spinner"></div>
        <p class="transition-text">Memuat halaman...</p>
    </div>

    <button id="scrollToTop" class="scroll-to-top" onclick="scrollToTop()">
        ↑
    </button>

    <script src="background-manager.js"></script>
    <script src="profile.js"></script>
</body>
</html>
