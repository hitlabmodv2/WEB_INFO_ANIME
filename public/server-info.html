<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Server - NimeKu</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .server-page-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .server-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-icon {
            font-size: 40px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--secondary-bg);
            border-radius: 12px;
        }

        .stat-title {
            font-size: 16px;
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 10px 0;
        }

        .stat-progress {
            margin-top: 15px;
        }

        .stat-progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .stat-progress-bar {
            width: 100%;
            height: 12px;
            background: var(--secondary-bg);
            border-radius: 10px;
            overflow: hidden;
        }

        .stat-progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease, background 0.5s ease;
        }

        .stat-progress-fill.low {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }

        .stat-progress-fill.medium {
            background: linear-gradient(90deg, #f39c12, #e67e22);
        }

        .stat-progress-fill.high {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }

        .stat-details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .stat-detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }

        .stat-detail-label {
            color: var(--text-muted);
        }

        .stat-detail-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .refresh-info {
            text-align: center;
            margin: 30px 0;
            padding: 15px;
            background: var(--secondary-bg);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .refresh-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .back-button-container {
            text-align: center;
            margin: 40px 0 20px;
        }

        .back-to-home-btn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .back-to-home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        body.dark-mode {
            --card-bg: #2c2c2c;
            --secondary-bg: #1a1a1a;
            --border-color: #444;
            --text-primary: #fff;
            --text-muted: #aaa;
        }

        body:not(.dark-mode) {
            --card-bg: #fff;
            --secondary-bg: #f5f5f5;
            --border-color: #e0e0e0;
            --text-primary: #333;
            --text-muted: #666;
        }
    </style>
    <script>
        function navigateWithTransition(url) {
            const transition = document.getElementById('pageTransition');
            if (transition) {
                transition.style.display = 'flex';
                setTimeout(() => {
                    window.location.href = url;
                }, 300);
            } else {
                window.location.href = url;
            }
        }

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
</head>
<body>
    <button id="menuToggle" class="menu-toggle" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div id="menuOverlay" class="menu-overlay"></div>

    <nav id="drawerMenu" class="drawer-menu">
        <div class="drawer-header">
            <h3>Menu</h3>
            <button id="closeDrawer" class="close-drawer" aria-label="Close Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="drawer-content">
            <button class="tab-btn" onclick="navigateWithTransition('index.html')">📅 Jadwal</button>
            <button class="tab-btn" onclick="navigateWithTransition('index.html')">📺 Sedang Tayang</button>
            <button class="tab-btn" onclick="navigateWithTransition('index.html')">🆕 Terbaru</button>
            <button class="tab-btn" onclick="navigateWithTransition('index.html')">🔥 Populer</button>
            <button class="tab-btn" onclick="navigateWithTransition('index.html')">🌸 Musim</button>
            <button class="tab-btn" onclick="navigateWithTransition('index.html')">💡 Rekomendasi</button>
            <button class="tab-btn" onclick="navigateWithTransition('index.html')">🎭 Genre</button>
            <button class="tab-btn" onclick="navigateWithTransition('index.html')">🔍 Cari</button>
            <div class="drawer-divider"></div>
            <button class="tab-btn developer-btn" onclick="navigateWithTransition('developer.html')">👨‍💻 Developer</button>
            <button class="tab-btn server-info-btn active">🖥️ Info Server</button>
        </div>
    </nav>

    <div class="container">
        <header>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <div class="header-content">
                <div class="header-title-wrapper">
                    <h1>📊 Info Server</h1>
                </div>
                <p class="subtitle">Monitoring Real-Time</p>
            </div>
        </header>

        <div class="server-page-container">
            <div class="refresh-info">
                <span class="refresh-indicator"></span>
                Data diperbarui otomatis setiap 3 detik
            </div>

            <div class="server-stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">💾</div>
                        <div>
                            <p class="stat-title">Total Memory</p>
                        </div>
                    </div>
                    <div class="stat-value" id="totalRam">-</div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">📈</div>
                        <div>
                            <p class="stat-title">Memory Usage</p>
                        </div>
                    </div>
                    <div class="stat-value" id="usedRam">-</div>
                    <div class="stat-progress">
                        <div class="stat-progress-label">
                            <span>Terpakai</span>
                            <span id="ramPercentage">0%</span>
                        </div>
                        <div class="stat-progress-bar">
                            <div class="stat-progress-fill low" id="ramProgressBar"></div>
                        </div>
                    </div>
                    <div class="stat-details">
                        <div class="stat-detail-item">
                            <span class="stat-detail-label">Tersedia</span>
                            <span class="stat-detail-value" id="freeRam">-</span>
                        </div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">⚙️</div>
                        <div>
                            <p class="stat-title">Processor</p>
                        </div>
                    </div>
                    <div class="stat-value" id="cpuCores">-</div>
                    <div class="stat-details">
                        <div class="stat-detail-item">
                            <span class="stat-detail-label">Model</span>
                            <span class="stat-detail-value" id="cpuModel">-</span>
                        </div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">⏱️</div>
                        <div>
                            <p class="stat-title">Uptime</p>
                        </div>
                    </div>
                    <div class="stat-value" id="uptime">-</div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">🌐</div>
                        <div>
                            <p class="stat-title">Platform</p>
                        </div>
                    </div>
                    <div class="stat-value" id="platform">-</div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">🖥️</div>
                        <div>
                            <p class="stat-title">Hostname</p>
                        </div>
                    </div>
                    <div class="stat-value" id="hostname">-</div>
                </div>
            </div>

            <div class="back-button-container">
                <button onclick="navigateWithTransition('index.html')" class="back-to-home-btn">
                    ← Kembali ke Home
                </button>
            </div>
        </div>

        <footer></footer>

        <div class="powered-by">
            <p class="greeting" id="greeting">Selamat Pagi</p>
            <p class="datetime" id="datetime">Loading...</p>
            <p class="credit">Powered By <span class="creator">bang wily</span></p>
        </div>
    </div>

    <div id="pageTransition">
        <div class="transition-spinner"></div>
        <p class="transition-text">Memuat halaman...</p>
    </div>

    <button id="scrollToTop" class="scroll-to-top" onclick="scrollToTop()">
        ↑
    </button>

    <script src="background-manager.js"></script>
    <script src="server-info.js"></script>
    <script>
        function initScrollToTop() {
            const scrollBtn = document.getElementById('scrollToTop');
            
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 300) {
                    scrollBtn.classList.add('show');
                } else {
                    scrollBtn.classList.remove('show');
                }
            });
        }

        function getJakartaHour() {
            const now = new Date();
            const jakartaTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
            return jakartaTime.getHours();
        }

        function shouldBeDarkMode() {
            const hour = getJakartaHour();
            return hour >= 15 || hour < 5;
        }

        function applyAutoTheme() {
            const shouldDark = shouldBeDarkMode();
            const isDark = document.body.classList.contains('dark-mode');
            
            if (shouldDark && !isDark) {
                document.body.classList.add('dark-mode');
            } else if (!shouldDark && isDark) {
                document.body.classList.remove('dark-mode');
            }
        }

        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            applyAutoTheme();
            
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                
                themeToggle.style.transform = 'scale(0.8) rotate(180deg)';
                setTimeout(() => {
                    themeToggle.style.transform = '';
                }, 200);
            });
        }

        setInterval(() => {
            applyAutoTheme();
        }, 60000);

        function initDrawerMenu() {
            const menuToggle = document.getElementById('menuToggle');
            const drawerMenu = document.getElementById('drawerMenu');
            const menuOverlay = document.getElementById('menuOverlay');
            const closeDrawer = document.getElementById('closeDrawer');
            
            function openDrawer() {
                if (drawerMenu) drawerMenu.classList.add('active');
                if (menuOverlay) menuOverlay.classList.add('active');
                if (menuToggle) menuToggle.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            
            function closeDrawerFunc() {
                if (drawerMenu) drawerMenu.classList.remove('active');
                if (menuOverlay) menuOverlay.classList.remove('active');
                if (menuToggle) menuToggle.classList.remove('active');
                document.body.style.overflow = '';
            }
            
            if (menuToggle) {
                menuToggle.addEventListener('click', () => {
                    if (drawerMenu && drawerMenu.classList.contains('active')) {
                        closeDrawerFunc();
                    } else {
                        openDrawer();
                    }
                });
            }
            
            if (closeDrawer) {
                closeDrawer.addEventListener('click', closeDrawerFunc);
            }
            
            if (menuOverlay) {
                menuOverlay.addEventListener('click', closeDrawerFunc);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
            initScrollToTop();
            initDrawerMenu();
        });
    </script>
</body>
</html>
