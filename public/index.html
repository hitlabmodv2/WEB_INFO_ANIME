<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Anime Real-Time | NimeKu</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="menuToggle" class="menu-toggle" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div id="menuOverlay" class="menu-overlay"></div>

    <nav id="drawerMenu" class="drawer-menu">
        <div class="drawer-header">
            <h3>Menu</h3>
            <button id="closeDrawer" class="close-drawer" aria-label="Close Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="drawer-content">
            <button class="tab-btn active" data-tab="schedule">📅 Jadwal</button>
            <button class="tab-btn" data-tab="airing">📺 Sedang Tayang</button>
            <button class="tab-btn" data-tab="new">🆕 Terbaru</button>
            <button class="tab-btn" data-tab="popular">🔥 Populer</button>
            <button class="tab-btn" data-tab="season">🌸 Musim</button>
            <button class="tab-btn" data-tab="recommendations">💡 Rekomendasi</button>
            <button class="tab-btn" data-tab="genres">🎭 Genre</button>
            <button class="tab-btn" data-tab="search">🔍 Cari</button>
            <div class="drawer-divider"></div>
            <button class="tab-btn developer-btn" onclick="navigateWithTransition('developer.html')">👨‍💻 Developer</button>
            <button class="tab-btn server-info-btn" onclick="navigateWithTransition('server-info.html')">🖥️ Info Server</button>
        </div>
    </nav>

    <div class="container">
        <header>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <div class="header-content">
                <div class="header-title-wrapper">
                    <h1>Jadwal Anime</h1>
                </div>
                <p class="subtitle">Update Real-Time</p>
                <div class="last-update">
                    <span id="lastUpdate">Loading...</span>
                </div>
            </div>
        </header>

        <div id="notification" class="notification"></div>

        <div id="searchSection" class="search-section" style="display: none;">
            <input type="text" id="searchInput" placeholder="Cari anime...">
            <button id="searchBtn">Cari</button>
        </div>

        <div id="seasonSection" class="season-section" style="display: none;">
            <div class="season-selector">
                <select id="seasonSelect" class="season-dropdown">
                    <option value="">Pilih Musim...</option>
                </select>
            </div>
        </div>

        <div id="genreSection" class="genre-section" style="display: none;">
            <div class="genre-search-container">
                <input type="text" id="genreSearchInput" placeholder="Cari genre anime..." autocomplete="off">
                <div id="genreSearchSuggestions" class="genre-suggestions"></div>
            </div>
            <div id="genreList" class="genre-list"></div>
        </div>

        <div class="type-filters-mini" id="typeFiltersMini" style="display: none;">
            <button class="type-mini-btn active" data-type="">Semua</button>
            <button class="type-mini-btn" data-type="tv">TV</button>
            <button class="type-mini-btn" data-type="ona">ONA</button>
            <button class="type-mini-btn" data-type="ova">OVA</button>
            <button class="type-mini-btn" data-type="movie">Movie</button>
            <button class="type-mini-btn" data-type="special">Special</button>
        </div>


        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingText">Memuat data...</p>
            <div class="loading-percentage" id="loadingPercentage">0%</div>
        </div>

        <div id="content" class="content">
        </div>

        <div id="paginationContainer" style="text-align: center; padding: 20px; display: none;">
            <div class="pagination-controls">
                <button id="prevPageBtn" class="pagination-btn" disabled>← Sebelumnya</button>
                <span id="pageInfo" class="page-info">Halaman 1</span>
                <button id="nextPageBtn" class="pagination-btn">Berikutnya →</button>
            </div>
        </div>

        <footer></footer>

        <div class="powered-by">
            <p class="greeting" id="greeting">Selamat Pagi</p>
            <p class="datetime" id="datetime">Loading...</p>
            <p class="credit">Powered By <span class="creator">bang wily</span></p>
        </div>
    </div>

    <div id="pageTransition">
        <div class="transition-spinner"></div>
        <p class="transition-text">Memuat halaman...</p>
    </div>

    <button id="scrollToTop" class="scroll-to-top" onclick="scrollToTop()">
        ↑
    </button>


    <!-- Floating Action Button -->
    <button class="mobile-fab" id="mobileFab" onclick="toggleQuickActions()">
        +
    </button>

    <!-- Quick Action Menu -->
    <div class="quick-action-menu" id="quickActionMenu">
        <button class="quick-action-item" onclick="switchToTab('recommendations'); toggleQuickActions();" title="Rekomendasi">💡</button>
        <button class="quick-action-item" onclick="switchToTab('season'); toggleQuickActions();" title="Musim">🌸</button>
        <button class="quick-action-item" onclick="switchToTab('popular'); toggleQuickActions();" title="Populer">🔥</button>
    </div>


    <!-- Swipe Indicators -->
    <div class="swipe-indicator left" id="swipeLeft">
        ←
    </div>
    <div class="swipe-indicator right" id="swipeRight">
        →
    </div>

    <script src="background-manager.js"></script>
    <script src="script.js"></script>
</body>
</html>
